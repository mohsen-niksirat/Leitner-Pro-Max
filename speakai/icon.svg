<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="url(#orbGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Ambient Aura Glow -->
  <circle cx="256" cy="240" r="210" fill="url(#glowGrad)" />

  <!-- Concentric AI Soundwave Rings -->
  <circle cx="256" cy="236" r="168" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="14 10" />
  <circle cx="256" cy="236" r="138" fill="none" stroke="#10b981" stroke-width="3.5" stroke-opacity="0.35" />

  <!-- Speech Bubble + Orb Container -->
  <g filter="url(#dropShadow)">
    <path
      d="M256 112c-68.5 0-124 51.9-124 116 0 29.8 12 57 31.8 77.5L148 354l52.8-17.6c17.1 6.2 35.7 9.6 55.2 9.6 68.5 0 124-51.9 124-116S324.5 112 256 112z"
      fill="url(#orbGrad)"
    />
  </g>

  <!-- Soundwave Equalizer Bars (Left & Right of Mic) -->
  <rect x="166" y="212" width="10" height="36" rx="5" fill="#ffffff" fill-opacity="0.75" />
  <rect x="184" y="196" width="10" height="68" rx="5" fill="#ffffff" fill-opacity="0.9" />
  <rect x="318" y="196" width="10" height="68" rx="5" fill="#ffffff" fill-opacity="0.9" />
  <rect x="336" y="212" width="10" height="36" rx="5" fill="#ffffff" fill-opacity="0.75" />

  <!-- Center Studio Microphone -->
  <g filter="url(#dropShadow)">
    <rect x="232" y="162" width="48" height="84" rx="24" fill="url(#micGrad)" />
    <path
      d="M210 218v6c0 25.4 20.6 46 46 46s46-20.6 46-46v-6"
      fill="none"
      stroke="#ffffff"
      stroke-width="12"
      stroke-linecap="round"
    />
    <line x1="256" y1="270" x2="256" y2="298" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="232" y1="298" x2="280" y2="298" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- AI Sparkle Star (Top Right) -->
  <path
    d="M386 108 L394 130 L416 138 L394 146 L386 168 L378 146 L356 138 L378 130 Z"
    fill="#34d399"
  />
  <circle cx="136" cy="136" r="8" fill="#818cf8" />

  <!-- Bottom Badge "AI COACH" -->
  <rect x="156" y="400" width="200" height="44" rx="22" fill="#0f172a" stroke="#6366f1" stroke-width="3" stroke-opacity="0.6" />
  <text
    x="256"
    y="428"
    text-anchor="middle"
    fill="#e2e8f0"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="3"
  >
    SPEAK AI
  </text>
</svg>
